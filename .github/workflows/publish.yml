name: Instagram yayını

on:
  schedule:
    # Her 15 dakikada bir (UTC). GitHub zamanlanmış çalışmaları yoğunlukta birkaç dakika geciktirebilir.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Deneme: hiçbir şey yayınlama, sadece ne yayınlanacağını göster"
        type: boolean
        default: true
      only_id:
        description: "Sadece bu gönderi (ör. P1). Boş = hepsi"
        required: false
      force:
        description: "only_id'deki gönderiyi saatini beklemeden ŞİMDİ yayınla"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Zamanı gelen gönderileri yayınla
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          ONLY_ID: ${{ inputs.only_id }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python3 publisher/publish.py

      - name: Yayın kaydını depoya yaz
        if: always()
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "deutschgiz-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "Yayın kaydı güncellendi [skip ci]"
            git pull --rebase --autostash
            git push
          fi
